<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Para ti</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&display=swap">
  <style>
    :root {
      --red: #e0132f;
      --ink: #2b1a1d;
      --line: #f0d9dc;
      --soft: #fdf3f4;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: "Playfair Display", Georgia, serif;
      line-height: 1.55
    }

    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 0 22px 84px
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      transition: min-height .6s ease
    }

    .hero.open {
      min-height: 0;
      padding-top: 34px
    }

    .heart {
      width: 150px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: width .6s ease;
      animation: beat 1.2s ease-in-out infinite
    }

    .heart:active {
      transform: scale(.94)
    }

    .hero.open .heart {
      width: 84px;
      animation: none
    }

    @keyframes beat {
      50% {
        transform: scale(1.1)
      }
    }

    .hint {
      font-style: italic;
      margin: 6px 0 0;
      opacity: .7
    }

    .hero.open .hint {
      display: none
    }

    h1 {
      font-size: 2.1rem;
      font-style: italic;
      font-weight: 500;
      margin: 10px 0 0;
      line-height: 1.2
    }

    .sub {
      font-style: italic;
      margin: 4px 0 0;
      opacity: .75
    }

    .reveal {
      display: none
    }

    .reveal.on {
      display: block;
      animation: rise .8s ease both
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px)
      }
    }

    .heart:focus-visible,
    a:focus-visible,
    .nav-arrow:focus-visible,
    .fp-btn:focus-visible,
    .fp-toggle:focus-visible,
    .fp-expand:focus-visible,
    .lb-btn:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 3px
    }

    .stage {
      position: relative
    }

    .nav-arrow {
      display: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      color: var(--red);
      box-shadow: 0 6px 18px rgba(43, 26, 29, .12);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform .2s ease, background-color .2s ease, opacity .2s ease
    }

    .nav-arrow:hover {
      background: var(--soft);
      transform: translateY(-50%) scale(1.06)
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(.96)
    }

    .nav-arrow:disabled {
      cursor: default;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, .94)
    }

    .nav-arrow.prev {
      left: -16px
    }

    .nav-arrow.next {
      right: -16px
    }

    .nav-arrow svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 14px;
      padding: 22px 2px 12px;
      scrollbar-width: none
    }

    .carousel::-webkit-scrollbar {
      display: none
    }

    .slide {
      flex: 0 0 86%;
      scroll-snap-align: center;
      aspect-ratio: 4/5;
      border-radius: 18px;
      overflow: hidden;
      background: var(--soft);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-style: italic;
      padding: 12px
    }

    .slide.has-img {
      padding: 0;
      cursor: zoom-in
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease
    }

    .dots {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin: 4px 0 30px
    }

    .dots b {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line)
    }

    .dots b.on {
      background: var(--red)
    }

    h2 {
      font-size: 1.4rem;
      font-style: italic;
      font-weight: 500;
      margin: 0 0 14px;
      text-align: center
    }

    .songs {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 14px;
      margin: 0;
      padding: 6px 2px 12px;
      list-style: none;
      scrollbar-width: none
    }

    .songs::-webkit-scrollbar {
      display: none
    }

    .song {
      flex: 0 0 78%;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding: 22px 16px 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--soft);
      transition: border-color .25s ease, box-shadow .25s ease
    }

    .song.active {
      border-color: rgba(224, 19, 47, .45);
      box-shadow: 0 8px 24px rgba(224, 19, 47, .08)
    }

    .disc {
      flex: 0 0 auto;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      background: repeating-radial-gradient(circle, #161616 0 2px, #2c2c2c 2px 4px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      animation: spin 3.2s linear infinite;
      animation-play-state: paused
    }

    .disc.play {
      animation-play-state: running
    }

    .disc .label {
      position: absolute;
      inset: 27%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--red);
      border: 2px solid #fff
    }

    .disc .label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .disc:after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      margin: -4.5px 0 0 -4.5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .4)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .disc:focus-visible,
    .pp:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 3px
    }

    .info {
      width: 100%;
      min-width: 0
    }

    .info b {
      font-weight: 500;
      display: block;
      line-height: 1.3
    }

    .info small {
      opacity: .7;
      font-style: italic;
      display: block
    }

    .prog {
      height: 4px;
      border-radius: 99px;
      background: var(--line);
      margin-top: 8px;
      overflow: hidden
    }

    .prog i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--red)
    }

    .pp {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 0;
      background: var(--red);
      color: #fff;
      font-size: .9rem;
      cursor: pointer
    }

    .ytbox {
      width: 100%;
      display: none;
      border-radius: 12px;
      overflow: hidden;
      background: #000
    }

    .ytbox.on {
      display: block
    }

    .ytbox iframe {
      display: block;
      width: 100%;
      height: 200px;
      border: 0
    }

    .yterr {
      font-size: .85rem;
      font-style: italic;
      color: var(--red);
      min-height: 0
    }

    .yterr:empty {
      display: none
    }

    .letter {
      white-space: pre-wrap;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 20px;
      margin-top: 34px
    }

    .sign {
      text-align: right;
      font-style: italic;
      color: var(--red);
      margin-top: 12px
    }

    /* Floating mini-player */
    .fp {
      position: fixed;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
      z-index: 50;
      display: none
    }

    .fp.on {
      display: block;
      animation: fpIn .4s ease both
    }

    @keyframes fpIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.92)
      }
    }

    .fp-card {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 27px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(43, 26, 29, .16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      transition: width .28s cubic-bezier(.22, 1, .36, 1), height .28s cubic-bezier(.22, 1, .36, 1), border-radius .28s ease, box-shadow .28s ease
    }

    .fp-body {
      position: absolute;
      inset: 0;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease
    }

    .fp-top {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .fp-disc {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--red);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
      animation: spin 3.2s linear infinite;
      animation-play-state: paused
    }

    .fp-disc.play {
      animation-play-state: running
    }

    .fp-disc img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .fp-meta {
      flex: 1;
      min-width: 0
    }

    .fp-title {
      font-size: .88rem;
      font-weight: 500;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink)
    }

    .fp-sub {
      display: flex;
      gap: 8px;
      font-size: .75rem;
      font-style: italic;
      opacity: .72;
      margin-top: 1px
    }

    .fp-prog {
      height: 3px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      margin: 6px 0
    }

    .fp-prog i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--red);
      transition: width .25s linear
    }

    .fp-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 48px;
      height: 36px
    }

    .fp-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: background-color .18s ease, border-color .18s ease, color .18s ease, transform .15s ease
    }

    .fp-btn:hover {
      background: #fde6e9;
      border-color: rgba(224, 19, 47, .35);
      color: var(--red)
    }

    .fp-btn:active {
      transform: scale(.92)
    }

    .fp-btn.muted {
      color: var(--red);
      border-color: rgba(224, 19, 47, .4)
    }

    .fp-btn svg,
    .fp-toggle svg {
      width: 16px;
      height: 16px;
      display: block
    }

    .fp-toggle {
      position: absolute;
      right: 5px;
      bottom: 5px;
      z-index: 2;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(224, 19, 47, .3);
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, background-color .18s ease
    }

    .fp-toggle:hover {
      background: #c80f29
    }

    .fp-toggle:active {
      transform: scale(.93)
    }

    .fp-toggle.playing::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(224, 19, 47, .25);
      animation: pulse 1.8s ease-out infinite;
      pointer-events: none
    }

    @keyframes pulse {
      0% {
        transform: scale(.95);
        opacity: .9
      }

      100% {
        transform: scale(1.22);
        opacity: 0
      }
    }

    .fp-expand {
      display: none;
      position: absolute;
      left: 6px;
      bottom: 13px;
      z-index: 2;
      width: 24px;
      height: 28px;
      border: 0;
      background: transparent;
      color: var(--red);
      font-size: 1.1rem;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent
    }

    .fp.open .fp-card,
    .fp.kbd .fp-card {
      width: min(310px, calc(100vw - 32px));
      height: 118px;
      border-radius: 22px;
      box-shadow: 0 16px 38px rgba(43, 26, 29, .2)
    }

    .fp.open .fp-body,
    .fp.kbd .fp-body {
      opacity: 1;
      pointer-events: auto;
      transition: opacity .22s ease .08s
    }

    .fp.open .fp-expand,
    .fp.kbd .fp-expand {
      display: none !important
    }

    @media (hover:hover) {
      .fp:hover .fp-card {
        width: min(310px, calc(100vw - 32px));
        height: 118px;
        border-radius: 22px;
        box-shadow: 0 16px 38px rgba(43, 26, 29, .2)
      }

      .fp:hover .fp-body {
        opacity: 1;
        pointer-events: auto;
        transition: opacity .22s ease .08s
      }
    }

    @media (hover:none) {
      .fp-card {
        width: 82px;
        height: 54px
      }

      .fp-expand {
        display: flex
      }
    }

    /* Lightbox for viewing photos on computer/mobile */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(26, 14, 17, .86);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px
    }

    .lb.on {
      display: flex;
      animation: rise .2s ease both
    }

    .lb img {
      max-width: min(90vw, 780px);
      max-height: 84vh;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
      object-fit: contain;
      display: block
    }

    .lb-btn {
      position: fixed;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .14);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      padding: 0;
      backdrop-filter: blur(4px)
    }

    .lb-btn:hover {
      background: rgba(255, 255, 255, .26)
    }

    .lb-close {
      top: 18px;
      right: 18px
    }

    .lb-prev {
      left: 18px;
      top: 50%;
      transform: translateY(-50%)
    }

    .lb-next {
      right: 18px;
      top: 50%;
      transform: translateY(-50%)
    }

    .lb-count {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-style: italic;
      font-size: .95rem;
      background: rgba(0, 0, 0, .35);
      padding: 4px 12px;
      border-radius: 999px
    }

    /* Desktop adaptation without losing mobile view */
    @media (min-width:768px) {
      body {
        background: radial-gradient(circle at 50% 0%, #fff7f8 0%, #ffffff 52%)
      }

      main {
        max-width: 1060px;
        padding: 0 44px 96px
      }

      .hero {
        gap: 10px
      }

      .hero.open {
        padding-top: 42px;
        padding-bottom: 8px
      }

      .heart {
        width: 175px
      }

      .hero.open .heart {
        width: 90px
      }

      h1 {
        font-size: clamp(2.3rem, 3.4vw, 2.9rem)
      }

      .sub {
        font-size: 1.12rem
      }

      h2 {
        font-size: 1.7rem;
        margin: 8px 0 18px
      }

      .nav-arrow {
        display: flex
      }

      .carousel {
        gap: 18px;
        padding: 24px 2px 14px
      }

      .slide {
        flex: 0 0 calc((100% - 18px) / 2);
        scroll-snap-align: start
      }

      .slide.has-img:hover img {
        transform: scale(1.03)
      }

      .songs {
        gap: 18px;
        padding: 8px 2px 14px
      }

      .song {
        flex: 0 0 calc((100% - 18px) / 2);
        scroll-snap-align: start;
        padding: 24px 18px 20px
      }

      .letter {
        max-width: 740px;
        margin: 46px auto 0;
        padding: 34px 42px;
        font-size: 1.06rem;
        line-height: 1.72;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(43, 26, 29, .04)
      }

      .fp {
        right: 26px;
        bottom: 26px
      }
    }

    @media (min-width:1024px) {
      .slide {
        flex: 0 0 calc((100% - 36px) / 3)
      }

      .song {
        flex: 0 0 calc((100% - 36px) / 3)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }

      .heart,
      .fp-disc,
      .fp-toggle.playing::before {
        animation: none
      }

      .reveal.on,
      .fp.on,
      .lb.on {
        animation: none
      }

      .hero,
      .heart,
      .fp-card,
      .fp-body,
      .slide img {
        transition: none
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" id="hero">
      <svg class="heart" id="heart" viewBox="0 0 100 90" role="button" tabindex="0" aria-label="Corazón: tócalo">
        <path d="M50 85C10 55 2 30 18 15C32 2 46 10 50 22C54 10 68 2 82 15C98 30 90 55 50 85Z" fill="#e0132f" />
      </svg>
      <p class="hint">Toca el corazón</p>
      <div class="reveal" id="r1">
        <h1 id="titulo"></h1>
        <p class="sub" id="subt"></p>
      </div>
    </section>

    <div class="reveal" id="r2">
      <div class="stage">
        <button class="nav-arrow prev" id="carPrev" type="button" aria-label="Fotos anteriores"><svg viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg></button>
        <div class="carousel" id="car"></div>
        <button class="nav-arrow next" id="carNext" type="button" aria-label="Siguientes fotos"><svg viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
          </svg></button>
      </div>
      <div class="dots" id="dots"></div>
      <h2 id="songtitle">Nuestras canciones</h2>
      <div class="stage">
        <button class="nav-arrow prev" id="songPrev" type="button" aria-label="Canciones anteriores"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg></button>
        <ul class="songs" id="songs"></ul>
        <button class="nav-arrow next" id="songNext" type="button" aria-label="Siguientes canciones"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
          </svg></button>
      </div>
      <div class="dots" id="songdots"></div>
      <div class="letter" id="letter" style="display:none"><span id="carta"></span>
        <div class="sign" id="firma"></div>
      </div>
    </div>
  </main>

  <div class="fp" id="fp" aria-label="Control de música">
    <div class="fp-card">
      <div class="fp-body">
        <div class="fp-top">
          <div class="fp-disc" id="fpDisc"><img id="fpImg" alt=""></div>
          <div class="fp-meta">
            <div class="fp-title" id="fpTitle">Nuestras canciones</div>
            <div class="fp-sub"><span id="fpCount"></span><span id="fpStatus">En pausa</span></div>
          </div>
        </div>
        <div class="fp-prog"><i id="fpBar"></i></div>
        <div class="fp-actions">
          <button class="fp-btn" id="fpPrev" type="button" title="Canción anterior" aria-label="Canción anterior">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button class="fp-btn" id="fpNext" type="button" title="Siguiente canción" aria-label="Siguiente canción">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />

      $('songtitle').textContent = CONFIG.tituloCanciones;

      var fotos = CONFIG.fotos.length ? CONFIG.fotos : [null, null, null];

      fotos.forEach(function (src, i) {
        var d = document.createElement('div');
        d.className = 'slide' + (src ? ' has-img' : '');
        d.innerHTML = src ? '<img alt="Foto ' + (i + 1) + '" loading="lazy" decoding="async" src="' + src + '">' : 'Aquí va la foto ' + (i + 1);
        if (src) {
          var realIdx = fotosReales.push(src) - 1;
          d.addEventListener('click', function () { abrirLightbox(realIdx); });
        }
        $('car').appendChild(d);
        if (fotos.length <= 10) { var b = document.createElement('b'); if (!i) b.className = 'on'; $('dots').appendChild(b); }
      });
      if (fotos.length > 10) $('dots').textContent = '1 / ' + fotos.length;

      function setupTrack(track, prevBtn, nextBtn, dotsEl, count, isDots) {
        function update() {
          var max = track.scrollWidth - track.clientWidth;
          var k = max > 2 ? Math.round((track.scrollLeft / max) * (count - 1)) : 0;
          k = Math.max(0, Math.min(count - 1, k));
          if (isDots) {
            Array.prototype.forEach.call(dotsEl.children, function (b, j) { b.classList.toggle('on', j === k); });
          } else if (count > 1) {
            dotsEl.textContent = (k + 1) + ' / ' + count;
          }
          if (prevBtn) { prevBtn.style.opacity = track.scrollLeft <= 4 ? '.35' : '1'; prevBtn.disabled = track.scrollLeft <= 4; }
          if (nextBtn) { nextBtn.style.opacity = track.scrollLeft >= max - 4 ? '.35' : '1'; nextBtn.disabled = track.scrollLeft >= max - 4; }
        }
        function stepBy(dir) {
          var first = track.children[0];
          if (!first) return;
          var gap = parseFloat(getComputedStyle(track).gap) || 14;
          var cardStep = first.getBoundingClientRect().width + gap;
          var perPage = Math.max(1, Math.floor((track.clientWidth + gap + 2) / cardStep));
          track.scrollBy({ left: dir * perPage * cardStep, behavior: 'smooth' });
        }
        track.addEventListener('scroll', update);
        if (prevBtn) prevBtn.addEventListener('click', function () { stepBy(-1); });
        if (nextBtn) nextBtn.addEventListener('click', function () { stepBy(1); });
        window.addEventListener('resize', update);
        return update;
      }

      var actualizarCar = setupTrack($('car'), $('carPrev'), $('carNext'), $('dots'), fotos.length, fotos.length <= 10);

      function renderLightbox() {
        if (!fotosReales.length) return;

        $('lbImg').src = fotosReales[lbIdx];
        $('lbImg').alt = 'Foto ' + (lbIdx + 1);
        $('lbCount').textContent = (lbIdx + 1) + ' / ' + fotosReales.length;
      }
      function abrirLightbox(idx) {
        if (!fotosReales.length) return;
        lbIdx = idx;
        renderLightbox();
        $('lb').classList.add('on');
      }
      function cerrarLightbox() { $('lb').classList.remove('on'); }
      $('lbClose').addEventListener('click', cerrarLightbox);
      $('lbPrev').addEventListener('click', function () { lbIdx--; renderLightbox(); });
      $('lbNext').addEventListener('click', function () { lbIdx++; renderLightbox(); });
      $('lb').addEventListener('click', function (e) { if (e.target === $('lb')) cerrarLightbox(); });
      document.addEventListener('keydown', function (e) {
        if (!$('lb').classList.contains('on')) return;

      var actual = null, pistas = [], ytCola = [], ytPedido = false, silenciado = false;
      function cargarYT(cb) {
        if (window.YT && YT.Player) { cb(false); return; }

        var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
        s.onerror = function () { ytPedido = false; ytCola.splice(0).forEach(function (f) { f(true); }); };
        document.head.appendChild(s);
      }
      cargarYT(function () { });

      function centrarCancion(li) {
        var c = $('songs');

      function syncFP(p, on) {
        if (!p) return;

        $('fpCount').textContent = (idx + 1) + ' / ' + pistas.length;

      function reloj(p, on) {
        clearInterval(p.timer);

          try {
            var d = p.player.getDuration();
            if (d) {
              var pct = (100 * p.player.getCurrentTime() / d) + '%';

              if (actual === p) $('fpBar').style.width = pct;
            }

      }
      function mostrarErrorYT(p, msg) {

      function parar(p) {
        clearTimeout(p.autoCheck);
        ui(p, false); reloj(p, false);
        if (p.player && p.player.pauseVideo) { try { p.player.pauseVideo(); } catch (_) { } }

      function aplicarSilencio(player) {
        if (!player) return;

      function reproducir(p) {
        if (!p) return;
        if (actual && actual !== p) {
          actual.li.classList.remove('active');

        actual = p;
        p.li.classList.add('active');
        $('fpBar').style.width = p.bar.style.width || '0';

              onError: function () {
                clearTimeout(p.autoCheck);
                ui(p, false); reloj(p, false);
                var msg = location.protocol === 'file:'
                  ? 'Para reproducir aquí abre el proyecto desde un servidor web o GitHub Pages.'
                  : 'Este video no se puede reproducir aquí.';
                mostrarErrorYT(p, msg);
              }
            }
          });
        });
      }
      function alternar(p) { if (actual === p && p.disc.classList.contains('play')) parar(p); else reproducir(p); }

      CONFIG.canciones.forEach(function (s) {
        var foto = s.foto || CONFIG.fotoCanciones;
        var li = document.createElement('li'); li.className = 'song';
        li.innerHTML = '<button class="disc" type="button" aria-label="Reproducir ' + esc(s.titulo) + '"><span class="label">' +
          (foto ? '<img alt="" src="' + foto + '">' : '') + '</span></button>' +
          '<div class="info"><b>' + esc(s.titulo) + '</b><small>' + esc(s.artista) + '</small><div class="prog"><i></i></div></div>' +
          '<button class="pp" type="button" aria-label="Reproducir o pausar ' + esc(s.titulo) + '">▶</button>' +
          '<div class="ytbox"><div class="ytslot"></div></div><div class="yterr" role="status"></div>';
        var id = /^[A-Za-z0-9_-]{11}$/.test(s.youtube || '') ? s.youtube : '';
        var p = {
          li: li, id: id, titulo: s.titulo || 'Canción', foto: foto || '', disc: li.querySelector('.disc'), btn: li.querySelector('.pp'), bar: li.querySelector('.prog i'),
          box: li.querySelector('.ytbox'), slot: li.querySelector('.ytslot'), err: li.querySelector('.yterr'), player: null, timer: 0, autoCheck: 0, cargando: false
        };
        pistas.push(p);
        p.disc.addEventListener('click', function () { alternar(p); });
        p.btn.addEventListener('click', function () { alternar(p); });
        $('songs').appendChild(li);
      });

      var total = CONFIG.canciones.length;
      var actualizarSongs = setupTrack($('songs'), $('songPrev'), $('songNext'), $('songdots'), total, false);
      if (total > 1) $('songdots').textContent = '1 / ' + total;
      if (!total) { $('songtitle').style.display = 'none'; $('songPrev').style.display = 'none'; $('songNext').style.display = 'none'; }

      $('fpToggle').addEventListener('click', function () {
        if (!pistas.length) return;
        alternar(actual || pistas[0]);
      });
      $('fpPrev').addEventListener('click', function () {
        if (!pistas.length) return;
        var idx = actual ? pistas.indexOf(actual) : 0;
        var target = pistas[(idx - 1 + pistas.length) % pistas.length];
        centrarCancion(target.li);
        reproducir(target);
      });
      $('fpNext').addEventListener('click', function () {
        if (!pistas.length) return;
        var idx = actual ? pistas.indexOf(actual) : -1;
        var target = pistas[(idx + 1) % pistas.length];
        centrarCancion(target.li);
        reproducir(target);
      });
      $('fpMute').addEventListener('click', function () {
        silenciado = !silenciado;
        $('fpMute').innerHTML = silenciado ? ICON_VOL_OFF : ICON_VOL_ON;
        $('fpMute').classList.toggle('muted', silenciado);
        if (actual && actual.player) aplicarSilencio(actual.player);
      });
      $('fpJump').addEventListener('click', function () {
        $('songtitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (actual) centrarCancion(actual.li);
      });
      $('fpExpand').addEventListener('click', function (e) {
        e.stopPropagation();
        var open = $('fp').classList.toggle('open');
        $('fpExpand').setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      $('fp').addEventListener('focusin', function (e) {
        try { if (e.target.matches(':focus-visible')) $('fp').classList.add('kbd'); } catch (_) { }
      });
      $('fp').addEventListener('focusout', function () {
        setTimeout(function () {
          if (!$('fp').contains(document.activeElement)) $('fp').classList.remove('kbd');
        }, 0);
      });
      document.addEventListener('pointerdown', function () { $('fp').classList.remove('kbd'); });
      document.addEventListener('click', function (e) {
        if ($('fp').classList.contains('open') && !$('fp').contains(e.target)) {
          $('fp').classList.remove('open');
          $('fpExpand').setAttribute('aria-expanded', 'false');
        }
      });

      if (CONFIG.carta) {
        $('carta').textContent = CONFIG.carta; $('firma').textContent = CONFIG.firma; $('letter').style.display = 'block';
      }

      var abierto = false;
      function abrir() {
        if (abierto) return; abierto = true;
        if (navigator.vibrate) { try { navigator.vibrate(30); } catch (_) { } }
        $('hero').classList.add('open'); $('r1').classList.add('on'); $('r2').classList.add('on');
        $('heart').removeAttribute('role'); $('heart').removeAttribute('tabindex');
        requestAnimationFrame(function () { actualizarCar(); actualizarSongs(); });
        if (pistas.length) {
          $('fp').classList.add('on');
          reproducir(pistas[0]);
        }
      }
      $('heart').addEventListener('click', abrir);
      $('heart').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
    })();
  </script>
</body>

</html>
